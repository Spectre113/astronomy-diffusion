[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "astronomy-diffusion"
version = "0.1.0"
description = "LoRA inference for astronomy image generation and inpainting with Stable Diffusion."
requires-python = ">=3.10"
dependencies = [
    "torch==2.8.0",
    "diffusers==0.35.2",
    "transformers==4.57.1",
    "peft==0.17.1",
    "accelerate==1.11.0",
    "huggingface-hub==0.36.0",
    "numpy==2.2.6",
    "Pillow==12.0.0",
    "tqdm==4.67.1",
]

[project.scripts]
astronomy-generate = "astronomy_diffusion.text_to_image:main"
astronomy-inpaint = "astronomy_diffusion.inpainting:main"

[tool.setuptools.packages.find]
where = ["src"]
